name: РЎР±РѕСЂРєР° APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: РџСЂРёРЅСЏС‚РёРµ Р»РёС†РµРЅР·РёР№ Android SDK (СЃР°Рј SDK СѓР¶Рµ РµСЃС‚СЊ РЅР° СЂР°РЅРЅРµСЂРµ)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
        run: npm ci

      - name: РЎРёРЅС…СЂРѕРЅРёР·Р°С†РёСЏ РІРµР±-С‡Р°СЃС‚Рё СЃ Android
        run: npx cap sync android

      - name: РЎР±РѕСЂРєР° debug-APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: РџРѕРґРіРѕС‚РѕРІРєР° С„Р°Р№Р»Р°
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AssistManager.apk

      - name: РџСѓР±Р»РёРєР°С†РёСЏ РІ GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AssistManager.apk \
            --title "AssistManager (СЃР±РѕСЂРєР° $SHORT)" \
            --notes "РџРѕСЃР»РµРґРЅСЏСЏ СЃР±РѕСЂРєР° РёР· РІРµС‚РєРё main. РџРѕСЃР»РµРґРЅРµРµ РёР·РјРµРЅРµРЅРёРµ: $MSG" \
            --target "$GITHUB_SHA" \
            --latest
