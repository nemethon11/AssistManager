name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Принятие лицензий Android SDK (сам SDK уже есть на раннере)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Установка зависимостей
        run: npm ci

      - name: Проверки веб-части (npm test)
        run: npm test

      - name: Синхронизация веб-части с Android
        run: npx cap sync android

      - name: Проверки Kotlin-кода и сборка debug-APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Подготовка файла
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AssistManager.apk

      - name: Публикация в GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AssistManager.apk \
            --title "AssistManager (сборка $SHORT)" \
            --notes "Последняя сборка из ветки main. Последнее изменение: $MSG" \
            --target "$GITHUB_SHA" \
            --latest
